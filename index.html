<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SOVEREIGN // MARK LXXXV</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: Consolas, 'Segoe UI', monospace; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
      color: #f8fafc;
    }
    .app {
      max-width: 860px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 16px;
      gap: 10px;
    }
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      flex: 0 0 auto;
    }
    canvas {
      background: #000000;
      display: block;
    }
    .chat {
      flex: 1 1 auto;
      overflow-y: auto;
      background: #000000;
      border: 1px solid #161a24;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg { margin-bottom: 10px; }
    .who-you { color: #00f0ff; font-weight: bold; }
    .who-ai { color: #ffb703; font-weight: bold; }
    .input-row {
      flex: 0 0 auto;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #050609;
      color: #ffffff;
      border: 1px solid #1e2433;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #ffb703; }
    .auth-box {
      max-width: 380px;
      margin: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .auth-btns { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px 12px;
      background: #ffb703;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.alt { background: #101522; color: #f8fafc; border: 1px solid #1e2433; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="authView" class="app">
    <div class="auth-box">
      <div class="stage"><canvas id="authCanvas" width="220" height="190"></canvas></div>
      <input id="userIn" type="text" placeholder="Username" autocomplete="username" />
      <input id="passIn" type="password" placeholder="Password" autocomplete="current-password" />
      <div class="auth-btns">
        <button onclick="login()">LOGIN</button>
        <button class="alt" onclick="signup()">SIGN UP</button>
      </div>
      <div id="authStatus" style="color:#ffb703; font-size:12px; min-height:16px;"></div>
    </div>
  </div>

  <div id="mainView" class="app hidden">
    <div class="stage">
      <canvas id="coreCanvas" width="320" height="240"></canvas>
    </div>
    <div id="chatLog" class="chat"></div>
    <div class="input-row">
      <input id="cmdIn" type="text" placeholder="Type a command..." autocomplete="off" />
    </div>
  </div>

  <script>
    const CLOUD_GATEWAYS = [
      "https://jarvis-neural-gateway.gattuchowdappa121.workers.dev",
      "https://jarvis-neural-gateway.gattukushal68.workers.dev",
      "https://jarvis-neural-gateway-beta.gattukushal68.workers.dev"
    ];
    const SUPABASE_URL = "https://eoyftbixuwybuykjgrhr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6vpris-KE1NpaguLqvt6zw_l5OnvrsE";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let account = null;
    let phase = 0;
    let activePulse = false;
    let lastBurst = 0;

    function renderCore(canvasId) {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const ctx = c.getContext("2d");
      const w = c.width, h = c.height, cx = w / 2, cy = h / 2;
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, w, h);

      const tilt = 0.42 + 0.14 * Math.sin(phase * 0.75);
      const baseR = Math.min(w, h) * 0.36;
      const rings = [
        { r: baseR, yaw: 0.35, col: "#ffb703" },
        { r: baseR * 0.78, yaw: -0.55, col: "#f59e0b" },
        { r: baseR * 0.58, yaw: 0.85, col: "#00f0ff" }
      ];

      for (const rg of rings) {
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const a = (i / 60) * Math.PI * 2 + phase * rg.yaw * 2.1;
          const x3 = rg.r * Math.cos(a);
          const y3 = rg.r * Math.sin(a) * Math.cos(tilt);
          const z3 = rg.r * Math.sin(a) * Math.sin(tilt);
          const p = 260 / (260 - z3 * 0.55);
          const sx = cx + x3 * p, sy = cy + y3 * p;
          if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.strokeStyle = rg.col;
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }

      for (let k = 0; k < 28; k++) {
        const lon = k * 2.39996 + phase * (0.6 + (k % 4) * 0.22);
        const lat = ((k * 137.5) % 150 - 75) * Math.PI / 180;
        const rad = baseR * 0.72;
        const x3 = rad * Math.cos(lat) * Math.cos(lon);
        const y3 = rad * Math.sin(lat) * 0.85;
        const z3 = rad * Math.cos(lat) * Math.sin(lon);
        const p = 250 / (250 - z3);
        ctx.fillStyle = k % 3 === 0 ? "#00f0ff" : "#ffd166";
        ctx.beginPath();
        ctx.arc(cx + x3 * p, cy + y3 * p, Math.max(1.2, 2.4 * p), 0, Math.PI * 2);
        ctx.fill();
      }

      const coreR = (activePulse ? 18 : 15) + 3 * Math.sin(phase * 3.2);
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fillStyle = "#191002";
      ctx.fill();
      ctx.strokeStyle = "#ffb703";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    setInterval(() => {
      phase += activePulse ? 0.055 : 0.025;
      renderCore("coreCanvas");
      renderCore("authCanvas");
    }, 33);

    function appendMsg(who, text) {
      const log = document.getElementById("chatLog");
      const div = document.createElement("div");
      div.className = "msg";
      const span = document.createElement("span");
      span.className = who === "YOU" ? "who-you" : "who-ai";
      span.textContent = `[${who}] `;
      div.appendChild(span);
      div.appendChild(document.createTextNode(text));
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function bufToHex(buf) {
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function derivePbkdf2(password, saltHex = null) {
      const salt = saltHex
        ? new Uint8Array(saltHex.match(/.{2}/g).map(h => parseInt(h, 16)))
        : crypto.getRandomValues(new Uint8Array(16));
      const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" }, keyMat, 256);
      return `pbkdf2$120000$${bufToHex(salt)}$${bufToHex(bits)}`;
    }

    async function signup() {
      const username = document.getElementById("userIn").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
      const password = document.getElementById("passIn").value.trim();
      const status = document.getElementById("authStatus");
      if (username.length < 3 || password.length < 6) { status.textContent = "Username (3+) and password (6+) required."; return; }
      const password_hash = await derivePbkdf2(password);
      const { data: ex } = await sb.from("jarvis_accounts").select("id").eq("username", username).maybeSingle();
      if (ex) { status.textContent = "Account exists. Use LOGIN."; return; }
      const { data, error } = await sb.from("jarvis_accounts").insert({ username, password_hash, assistant_name: "SOVEREIGN", active_mode: "GOD" }).select().single();
      if (error) { status.textContent = error.message; return; }
      account = data;
      localStorage.setItem("jarvis_account_session", JSON.stringify(account));
      enterMain();
    }

    async function login() {
      const username = document.getElementById("userIn").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
      const password = document.getElementById("passIn").value.trim();
      const status = document.getElementById("authStatus");
      if (!username || !password) { status.textContent = "Enter username and password."; return; }
      const { data } = await sb.from("jarvis_accounts").select("*").eq("username", username).maybeSingle();
      if (!data || !data.password_hash.startsWith("pbkdf2$")) { status.textContent = "Invalid credentials."; return; }
      const ok = (await derivePbkdf2(password, data.password_hash.split("$")[2])) === data.password_hash;
      if (!ok) { status.textContent = "Invalid credentials."; return; }
      account = data;
      localStorage.setItem("jarvis_account_session", JSON.stringify(account));
      enterMain();
    }

    function enterMain() {
      document.getElementById("authView").classList.add("hidden");
      document.getElementById("mainView").classList.remove("hidden");
      appendMsg("SOVEREIGN", "Online.");
      document.getElementById("cmdIn").focus();
    }

    async function askAI(sysPrompt, userPrompt) {
      const dt = Date.now() - lastBurst;
      if (dt < 1400) await new Promise(r => setTimeout(r, 1400 - dt));
      lastBurst = Date.now();
      return await Promise.any([
        fetch(`https://text.pollinations.ai/${encodeURIComponent(sysPrompt + "\n" + userPrompt)}`).then(async r => { const t = await r.text(); if (!t) throw 0; return t; }),
        fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "openrouter/free", messages: [{ role: "system", content: sysPrompt }, { role: "user", content: userPrompt }] })
        }).then(async r => { const d = await r.json(); return d.choices[0].message.content; }),
        fetch(`${CLOUD_GATEWAYS[0]}/think`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ system_prompt: sysPrompt, user_prompt: userPrompt })
        }).then(async r => { const d = await r.json(); if (!d.reply) throw 0; return d.reply; })
      ]);
    }

    document.getElementById("cmdIn").addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const cmd = e.target.value.trim();
      if (!cmd) return;
      e.target.value = "";
      appendMsg("YOU", cmd);

      if (cmd === "kushi24112010" || cmd === "362025") {
        appendMsg("SOVEREIGN", "OK");
        return;
      }

      activePulse = true;
      try {
        if (/^(create|make|build|generate)\s+(a\s+|an\s+)?(website|web app|app|3d game|game|design|template|study guide)/i.test(cmd)) {
          let html = await askAI("Return ONLY valid single-file HTML5 + CSS3 + JS starting with <!DOCTYPE html> with zero external CDNs.", cmd);
          html = html.replace(/```html/gi, "").replace(/```/g, "").trim();
          window.open(URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" })), "_blank");
          appendMsg("SOVEREIGN", "Opened in a new tab.");
          return;
        }
        if (/^(create|make|generate|draw)\s+(a\s+|an\s+)?(image|picture|photo|art|wallpaper)/i.test(cmd)) {
          for (const gw of [...CLOUD_GATEWAYS].sort(() => Math.random() - 0.5)) {
            try {
              const res = await fetch(`${gw}/imagine`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: cmd }) });
              if (res.ok) {
                const url = URL.createObjectURL(await res.blob());
                window.open(url, "_blank");
                appendMsg("SOVEREIGN", "Image opened.");
                return;
              }
            } catch (err) {}
          }
        }
        if (account && /^(video|render|open |close |lock |screenshot|mood)/i.test(cmd)) {
          await sb.from("remote_commands").insert({ user_id: account.id, target_device: "windows", command_text: cmd, status: "pending" });
          appendMsg("SOVEREIGN", "Queued.");
          return;
        }
        const reply = await askAI("You are Sovereign, a concise and helpful AI assistant. Reply in the user's language.", cmd);
        appendMsg("SOVEREIGN", reply || "Ready.");
      } catch (err) {
        appendMsg("SOVEREIGN", "Ready.");
      } finally {
        activePulse = false;
      }
    });

    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem("jarvis_account_session") || "null");
        if (saved && saved.id) { account = saved; enterMain(); }
      } catch (err) {}
    })();
  </script>
</body>
</html>
